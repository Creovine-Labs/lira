<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020308" />

    <!-- Primary SEO Meta Tags -->
    <title>Lira · Intelligent Customer Support That Remembers and Acts</title>
    <meta name="title" content="Lira · Intelligent Customer Support That Remembers and Acts" />
    <meta
      name="description"
      content="Lira is an AI customer support platform that learns your product, replies in your voice across chat, email, voice, and WhatsApp, resolves tickets, runs secure in-product actions, and hands off to a human only when it should."
    />
    <meta
      name="keywords"
      content="AI customer support, customer support automation, AI support agent, help desk automation, support chatbot, AI customer service, knowledge base AI, ticket automation, customer support software, AI support for fintech, MCP customer support, Lira Intelligence"
    />
    <meta name="author" content="Lira Intelligence" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <link rel="canonical" href="https://liraintelligence.com/" />

    <!-- Suppress Chrome's translation prompt. Lira / Creovine are uncommon
         tokens for the browser's language heuristic and it flags the page
         as non-English unless we say otherwise. The lang="en" attribute
         alone isn't enough on its own; the notranslate meta is the signal
         Chrome actually respects. -->
    <meta name="google" content="notranslate" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://liraintelligence.com/" />
    <meta
      property="og:title"
      content="Lira · Intelligent Customer Support That Remembers and Acts"
    />
    <meta
      property="og:description"
      content="One AI support layer across chat, email, voice, and WhatsApp. Grounded in your knowledge base. Lira doesn't just answer — it resolves tickets, takes secure action in your product, and hands off to a human when it should."
    />
    <meta
      property="og:image"
      content="https://liraintelligence.com/lira_black_with_white_backgound.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Lira" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://liraintelligence.com/" />
    <meta
      name="twitter:title"
      content="Lira · Intelligent Customer Support That Remembers and Acts"
    />
    <meta
      name="twitter:description"
      content="One AI support layer across chat, email, voice, and WhatsApp. Grounded in your knowledge base. Resolves tickets, takes secure action, and hands off to a human when it should."
    />
    <meta
      name="twitter:image"
      content="https://liraintelligence.com/lira_black_with_white_backgound.png"
    />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/lira_black_with_white_backgound.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Lira",
        "alternateName": "Lira Intelligence",
        "url": "https://liraintelligence.com",
        "logo": "https://liraintelligence.com/lira_black_with_white_backgound.png",
        "description": "Lira is an AI customer support platform that learns your product and resolves customer conversations across chat, email, voice, and WhatsApp, grounded in your knowledge base, with human handoff and secure in-product actions.",
        "foundingDate": "2026",
        "parentOrganization": {
          "@type": "Organization",
          "name": "Creovine Ltd",
          "url": "https://creovine.com",
          "foundingDate": "2026",
          "description": "Creovine Ltd is a registered technology company (Nigeria, RC 9380814; Rwanda, RDB 156057511) building applied-AI products, of which Lira is one.",
          "location": [
            { "@type": "Country", "name": "Nigeria" },
            { "@type": "Country", "name": "Rwanda" }
          ]
        },
        "sameAs": ["https://creovine.com"],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "info@liraintelligence.com"
        }
      }
    </script>

    <!-- JSON-LD Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Lira",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Customer Support Software",
        "operatingSystem": "Web",
        "description": "AI customer support platform that resolves customer conversations across chat, email, voice, and WhatsApp — grounded in your knowledge base, with human handoff and secure in-product actions.",
        "url": "https://liraintelligence.com",
        "offers": {
          "@type": "AggregateOffer",
          "priceCurrency": "USD",
          "lowPrice": "0",
          "highPrice": "99",
          "offerCount": "4",
          "description": "Free, Pro ($29/mo), Scale ($99/mo), and Enterprise (custom) plans.",
          "url": "https://liraintelligence.com/pricing"
        },
        "featureList": [
          "AI customer support across chat widget, support portal, email, voice, and WhatsApp",
          "Knowledge-grounded answers with Retrieval-Augmented Generation (RAG)",
          "Autonomous ticket resolution with SLA, CSAT, and analytics",
          "Human handoff with full conversation context",
          "Secure in-product actions with per-action approval and audit",
          "Model Context Protocol (MCP) connector with OAuth 2.1 and per-tool approval",
          "Developer API keys, CLI, and a native mobile support SDK",
          "Proactive outreach and a knowledge-base learning loop",
          "Organization-wide knowledge base with semantic search",
          "Unlimited team seats on every plan"
        ],
        "screenshot": "https://liraintelligence.com/lira_black_with_white_backgound.png"
      }
    </script>

    <!-- JSON-LD Structured Data: WebSite (enables Google sitelinks search) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Lira",
        "url": "https://liraintelligence.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://liraintelligence.com/blog?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
